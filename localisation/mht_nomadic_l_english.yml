l_english:
 mht_nomadic.1.t:0 "The Northern Question"
 mht_nomadic.1.d:0 "The Mandate slips through our fingers. Officials memorialise the throne daily about the riders massing beyond the frontier, and [mht_horde.GetName] grows stronger with every season we do nothing. The Censorate speaks of omens; the generals speak of walls that will not hold. Yet we remain the Middle Kingdom, and Heaven has not yet withdrawn its favour. Let envoys be sent north with silk and with seals, and let them demand what is rightfully ours - the submission of the barbarian. Better to command it now than to plead for it later."
 mht_nomadic.1.a:0 "Send the envoys. Demand their submission."
 mht_nomadic.2.t:0 "Envoys from the Dragon Throne"
 mht_nomadic.2.d:0 "Riders from the south have come to our camp bearing silk, seals and a demand. The Emperor of China speaks of harmony and of our proper place beneath Heaven - but the words are brittle. [From.GetName] is in shambles. Their mandate slips away year by year, and the court fears us. They would have our submission now, while they can still ask for it rather than beg. The envoys await our answer."
 mht_nomadic.2.a:0 "Their fear is well placed. This is the moment to ride south."
 mht_nomadic.2.b:0 "We are not ready for a war with China. Let them have their tribute."
 mht_nomadic.2.c:0 "If they want our submission, they will have to come and take it."
 mht_nomadic.3.t:0 "The Steppe Refuses"
 mht_nomadic.3.d:0 "Our envoys have returned from the camp of [From.GetName] empty-handed and insulted. They will not submit. Their riders remain on our northern border, their strength grows, and every season they are permitted to defy us openly, the Mandate slips further from our grasp. The court is divided and awaits Your Majesty's decision."
 mht_nomadic.3.a:0 "We will not risk the dynasty on a war in the desert."
 mht_nomadic.3.b:0 "Let them be shown the superiority of the Middle Kingdom."
 mht_nomadic.3.c:0 "They will kneel and pay tribute like every barbarian before them."
 mht_nomadic.3.e:0 "China will be made whole. This is long overdue."
 mht_nomadic.3.f:0 "They will learn the strength of the Empire."
 mht_nomadic.4.t:0 "The Frontier Quiets"
 mht_nomadic.4.d:0 "The standoff is over."
 mht_nomadic.4.a:0 "Good."
